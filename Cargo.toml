[package]
name = "herdr-git"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Git history, diffs, blame, and repository operations for Herdr"
repository = "https://github.com/JeHwanYoo/herdr-git"

[dependencies]
crossterm = "0.28"
grep = "0.4"
ignore = "0.4"
libc = "0.2"
ratatui = "0.29"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syntect = "5.2"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
two-face = "0.5.1"
unicode-width = "0.2"
